<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farjni — Login</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">

      <!-- LEFT : FORM SIDE -->
      <section class="auth-form-side">
        <div class="form-wrapper">

          <div class="form-header">
            <span class="logo-dot"></span>
            <span class="logo-text">Farjni</span>
            <span class="logo-badge">ADMIN</span>
          </div>

          <!-- LOGIN FORM -->
          <form id="loginForm" class="auth-form active" novalidate>
            <h1 class="form-title">Login</h1>
            <p class="form-subtitle">Welcome back! Please enter your admin details.</p>

            <div class="input-group">
              <div class="input-box">
                <i class="bx bxs-user"></i>
                <input type="text" id="loginUsername" placeholder=" " autocomplete=username" />
                <label for="loginUsername">Username</label>
              </div>
              <small class="error-msg" data-for="loginUsername"></small>
            </div>

            <div class="input-group">
              <div class="input-box">
                <i class="bx bxs-lock-alt"></i>
                <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password" />
                <label for="loginPassword">Password</label>
                <button type="button" class="toggle-pass" data-target="loginPassword" aria-label="Show password">
                  <i class="bx bx-show"></i>
                </button>
              </div>
              <small class="error-msg" data-for="loginPassword"></small>
            </div>

            <div class="form-options">
              <label class="remember">
                <input type="checkbox" id="rememberMe" checked />
                <span>Remember me</span>
              </label>
              <a href="#" class="link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">
              <span class="btn-label">Login to Dashboard</span>
              <span class="btn-spinner"></span>
            </button>
          </form>

          <div id="formAlert" class="form-alert" role="alert"></div>
        </div>
      </section>

      <!-- RIGHT : BRANDING SIDE -->
      <section class="auth-brand-side">
        <div class="brand-content">
          <h2 class="brand-title">FARJNI<br />PANEL</h2>
          <div class="brand-divider"></div>
          <p class="brand-text">
            Premium streaming control panel. Manage live channels, movies,
            anime, ads and app updates — all from one place.
          </p>
          <div class="brand-shapes">
            <span class="shape shape-1"></span>
            <span class="shape shape-2"></span>
            <span class="shape shape-3"></span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
