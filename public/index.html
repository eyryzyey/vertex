<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول الاحترافي</title>
  
  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2d114d 0%, #150827 100%);
      overflow: hidden;
      perspective: 1000px;
    }

    /* خلفية الغابة البنفسجية المتدرجة */
    .bg-decor {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: radial-gradient(circle at center, rgba(147, 51, 234, 0.3) 0%, transparent 70%);
      pointer-events: none;
    }

    /* حاوية انيميشن المنزل */
    .house-stage {
      position: relative;
      width: 380px;
      perspective: 1200px;
    }

    /* أجزاء سقف وجدران المنزل للأنيميشن */
    .roof-left, .roof-right {
      position: absolute;
      top: -40px;
      width: 55%;
      height: 10px;
      background: #a855f7;
      box-shadow: 0 0 15px #a855f7;
      z-index: 10;
      transition: all 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .roof-left { left: 0; transform-origin: left center; }
    .roof-right { right: 0; transform-origin: right center; }

    /* كارت تسجيل الدخول الزجاجي */
    .login-card {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      
      /* بداية الانيميشن: مطوي كالمنزل المغلق */
      opacity: 0;
      transform: scale(0.3) rotateX(45deg) translateY(200px);
      transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* انيميشن الفتح والتأثير المتحرك */
    .house-stage.open .login-card {
      opacity: 1;
      transform: scale(1) rotateX(0deg) translateY(0);
    }

    .house-stage.open .roof-left {
      transform: rotate(-45deg) translateY(-30px);
      opacity: 0;
    }

    .house-stage.open .roof-right {
      transform: rotate(45deg) translateY(-30px);
      opacity: 0;
    }

    /* العنوان */
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h2 {
      color: #ffffff;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* الخانات */
    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    .input-box input {
      width: 100%;
      padding: 14px 45px 14px 15px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .input-box input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .input-box input:focus {
      border-color: #c084fc;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.3);
    }

    .input-box i {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.1rem;
    }

    /* خيارات تذكرني وكلمة المرور */
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 25px;
      padding: 0 5px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: #a855f7;
      cursor: pointer;
    }

    .forgot-pass {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: color 0.3s;
    }

    .forgot-pass:hover {
      color: #c084fc;
      text-decoration: underline;
    }

    /* زر Google الأبيض الكبير */
    .btn-google {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      border: none;
      border-radius: 30px;
      color: #2d114d;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(255, 255, 255, 0.2);
      background: #f8f9fa;
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    /* زر تسجيل دخول عادي بنفسجي */
    .btn-login-alt {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-login-alt:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #c084fc;
    }

    /* الرابط السفلي */
    .register-link {
      text-align: center;
      margin-top: 25px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .register-link a {
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      margin-right: 5px;
    }

    .register-link a:hover {
      text-decoration: underline;
      color: #c084fc;
    }
  </style>
</head>
<body>

  <div class="bg-decor"></div>

  <!-- هيكل انيميشن فتح المنزل -->
  <div class="house-stage" id="houseStage">
    <div class="roof-left"></div>
    <div class="roof-right"></div>

    <div class="login-card">
      <div class="login-header">
        <h2>تسجيل الدخول</h2>
      </div>

      <form onsubmit="event.preventDefault();">
        <div class="input-box">
          <input type="text" placeholder="اسم المستخدم / البريد" required>
          <i class="fas fa-user"></i>
        </div>

        <div class="input-box">
          <input type="password" placeholder="كلمة المرور" required>
          <i class="fas fa-lock"></i>
        </div>

        <div class="options">
          <label class="remember-me">
            <input type="checkbox"> تذكرني
          </label>
          <a href="#" class="forgot-pass">نسيت كلمة السر؟</a>
        </div>

        <!-- زر Google الأبيض الاحترافي -->
        <button type="button" class="btn-google" onclick="loginWithGoogle()">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          تسجيل الدخول بواسطة Google
        </button>

        <button type="submit" class="btn-login-alt">دخول بالحساب العادي</button>

        <div class="register-link">
          ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // تشغيل أنيميشن الفتح مثل المنزل عند تحميل الصفحة
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('houseStage').classList.add('open');
      }, 300);
    });

    // دالة الربط مع جوجل (جاهزة للربط مع Google OAuth)
    function loginWithGoogle() {
      alert("جاري التوجيه لتسجيل الدخول المباشر عبر Google...");
    }
  </script>
</body>
</html>
